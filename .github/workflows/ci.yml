name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Imagem pgvector, não postgres puro: a migration 001 cria índice ivfflat.
    # SQLite não é alternativa — os modelos usam JSONB e UUID do dialeto PG.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          # Derivada do run, como no job de e2e: servico efemero alcancavel
          # so de dentro do job. Literal com nome de senha dispara scanner de
          # segredo, e scanner que da alarme falso e scanner ignorado.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: medico360_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U test -d medico360_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql+asyncpg://test:ci-${{ github.run_id }}@localhost:55433/medico360_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: modelo de NER (DLP)
        run: python -m spacy download pt_core_news_sm
      # Escopo total: o débito histórico foi pago (86 findings) e as exceções
      # legítimas estão declaradas em `ruff.toml` via per-file-ignores.
      - name: ruff
        run: ruff check .

      # Piso de cobertura como catraca: o número é o medido hoje, arredondado
      # para baixo. Serve para impedir REGRESSÃO, não para atestar qualidade —
      # subir o piso conforme a cobertura crescer (ver plano de prontidão).
      - name: pytest
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=50

      # A cadeia de migrations precisa aplicar num banco vazio. Isso ficou
      # QUEBRADO por muito tempo (o schema nasceu de um create_all fora do
      # Alembic) e só passou a ser verificável depois da migration de baseline.
      # Falha diferente da de schema: o harness de teste monta o schema pelos
      # models, então sem este passo uma migration quebrada passaria despercebida.
      - name: migrations aplicam do zero
        env:
          DATABASE_URL: postgresql+asyncpg://test:ci-${{ github.run_id }}@localhost:55433/medico360_migrations_test
          PGPASSWORD: ci-${{ github.run_id }}
          # APP_ENV nao tem mais padrao: o Settings exige que seja declarada.
          APP_ENV: development
        run: |
          # Segredo efemero: o Settings exige a variavel, mas nada aqui depende
          # do valor. Gerar em runtime em vez de fixar evita um literal com cara
          # de credencial no repositorio - o scanner de segredos aponta, e com razao.
          export JWT_SECRET_KEY="$(openssl rand -hex 32)"
          psql -h localhost -p 55433 -U test -d medico360_test -c 'CREATE DATABASE medico360_migrations_test'
          alembic upgrade head

      # Falha em vulnerabilidade conhecida nas dependências fixadas.
      # `pdfplumber`/`openpyxl` processam arquivo enviado pelo usuário, então
      # CVE em parser é risco direto, não teórico.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

  frontend-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run build

  calculadoras-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculadoras-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: calculadoras-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run build

  # E2E depende de Postgres + backend rodando + usuário/calculadoras seedados
  # (ver calculadoras-app/e2e/helpers/auth.ts). A seed do usuário de teste fixo
  # ainda não está automatizada neste pipeline — roda best-effort e não bloqueia
  # o merge até essa infra ser adicionada (ver plano de melhorias, item 1.1).
  e2e-calculadoras:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medico360
          # Derivada do run em vez de fixa: nao e segredo (servico efemero,
          # alcancavel so de dentro do job), mas literal com nome de senha
          # dispara scanner e treina o time a ignorar alerta.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: medico360
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://medico360:ci-${{ github.run_id }}@localhost:5432/medico360
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      # O e2e assina token com esta chave (ver calculadoras-app/e2e/helpers/auth.ts),
      # entao ela precisa ser a mesma em todos os passos - dai o GITHUB_ENV.
      - name: gera segredo efemero do job
        run: |
          SEGREDO="$(openssl rand -hex 32)"
          echo "JWT_SECRET_KEY=$SEGREDO" >> "$GITHUB_ENV"
          # O helper do Playwright assina o token com a MESMA chave, e procura
          # em E2E_JWT_SECRET (ou num .env da raiz, que nao existe no CI).
          echo "E2E_JWT_SECRET=$SEGREDO" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      # `python -m` em vez de `python scripts/x.py`: a forma com caminho coloca
      # `scripts/` no sys.path em vez da raiz, e os seeds importam `app.*`.
      # Mesma causa do `prepend_sys_path` que o alembic precisou.
      - run: python -m scripts.seed_calculators
      - run: python -m scripts.seed_risco_cv_sbc2025
      # Sem este usuario o token assinado pelo Playwright e valido mas aponta
      # para alguem que nao existe, e toda rota autenticada devolve 401.
      - run: python -m scripts.seed_usuario_e2e
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: calculadoras-app/package-lock.json
      - run: npm ci
        working-directory: calculadoras-app
      - run: npx playwright install --with-deps chromium
        working-directory: calculadoras-app
      - name: start backend
        run: nohup uvicorn app.main:app --port 8000 &
      - name: start calculadoras-app
        working-directory: calculadoras-app
        run: nohup npm run dev -- --port 5174 &
      - run: npm run test:e2e
        working-directory: calculadoras-app
        env:
          E2E_BASE_URL: http://localhost:5174
