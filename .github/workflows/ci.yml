name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Lint restrito ao código com débito já resolvido nesta rodada de melhorias;
      # o restante do repo (alembic/, scripts/, e vários services/ legados) ainda
      # tem findings pré-existentes (imports, E712, datetime.UTC) fora do escopo
      # deste PR — ampliar o escopo conforme for sendo limpo, para não travar
      # merges com débito histórico não relacionado.
      - name: ruff
        run: ruff check app/calculators app/repositories app/core tests
      - name: pytest
        run: pytest -q

  frontend-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run build

  calculadoras-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculadoras-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: calculadoras-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run build

  # E2E depende de Postgres + backend rodando + usuário/calculadoras seedados
  # (ver calculadoras-app/e2e/helpers/auth.ts). A seed do usuário de teste fixo
  # ainda não está automatizada neste pipeline — roda best-effort e não bloqueia
  # o merge até essa infra ser adicionada (ver plano de melhorias, item 1.1).
  e2e-calculadoras:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medico360
          POSTGRES_PASSWORD: medico360
          POSTGRES_DB: medico360
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://medico360:medico360@localhost:5432/medico360
      JWT_SECRET_KEY: ci-e2e-secret-nao-usar-em-producao
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python scripts/seed_calculators.py
      - run: python scripts/seed_risco_cv_sbc2025.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: calculadoras-app/package-lock.json
      - run: npm ci
        working-directory: calculadoras-app
      - run: npx playwright install --with-deps chromium
        working-directory: calculadoras-app
      - name: start backend
        run: nohup uvicorn app.main:app --port 8000 &
      - name: start calculadoras-app
        working-directory: calculadoras-app
        run: nohup npm run dev -- --port 5174 &
      - run: npm run test:e2e
        working-directory: calculadoras-app
        env:
          E2E_BASE_URL: http://localhost:5174
