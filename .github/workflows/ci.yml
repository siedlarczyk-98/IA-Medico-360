name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Imagem pgvector, não postgres puro: a migration 001 cria índice ivfflat.
    # SQLite não é alternativa — os modelos usam JSONB e UUID do dialeto PG.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: medico360_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U test -d medico360_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql+asyncpg://test:test@localhost:55433/medico360_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: modelo de NER (DLP)
        run: python -m spacy download pt_core_news_sm
      # Escopo total: o débito histórico foi pago (86 findings) e as exceções
      # legítimas estão declaradas em `ruff.toml` via per-file-ignores.
      - name: ruff
        run: ruff check .

      # Piso de cobertura como catraca: o número é o medido hoje, arredondado
      # para baixo. Serve para impedir REGRESSÃO, não para atestar qualidade —
      # subir o piso conforme a cobertura crescer (ver plano de prontidão).
      - name: pytest
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=50

      # A cadeia de migrations precisa aplicar num banco vazio. Isso ficou
      # QUEBRADO por muito tempo (o schema nasceu de um create_all fora do
      # Alembic) e só passou a ser verificável depois da migration de baseline.
      # Falha diferente da de schema: o harness de teste monta o schema pelos
      # models, então sem este passo uma migration quebrada passaria despercebida.
      - name: migrations aplicam do zero
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:55433/medico360_migrations_test
          JWT_SECRET_KEY: chave-de-ci-nao-usar-em-producao-com-32-bytes
        run: |
          PGPASSWORD=test psql -h localhost -p 55433 -U test -d medico360_test             -c 'CREATE DATABASE medico360_migrations_test'
          alembic upgrade head

      # Falha em vulnerabilidade conhecida nas dependências fixadas.
      # `pdfplumber`/`openpyxl` processam arquivo enviado pelo usuário, então
      # CVE em parser é risco direto, não teórico.
      #
      # As exceções abaixo são TODAS do starlette, que é dependência transitiva
      # do FastAPI: corrigi-las exige subir fastapi 0.115 -> 0.141 (starlette
      # 1.6). Esse salto foi testado — a suíte passa —, mas muda a estrutura
      # interna de rotas e traz depreciações, então é decisão de release, não de
      # CI. Remover estas exceções junto com o upgrade.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict             --ignore-vuln PYSEC-2026-161             --ignore-vuln PYSEC-2026-248             --ignore-vuln PYSEC-2026-249             --ignore-vuln PYSEC-2026-1941             --ignore-vuln PYSEC-2026-1942             --ignore-vuln PYSEC-2026-2280             --ignore-vuln PYSEC-2026-2281

  frontend-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run build

  calculadoras-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculadoras-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: calculadoras-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run build

  # E2E depende de Postgres + backend rodando + usuário/calculadoras seedados
  # (ver calculadoras-app/e2e/helpers/auth.ts). A seed do usuário de teste fixo
  # ainda não está automatizada neste pipeline — roda best-effort e não bloqueia
  # o merge até essa infra ser adicionada (ver plano de melhorias, item 1.1).
  e2e-calculadoras:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medico360
          POSTGRES_PASSWORD: medico360
          POSTGRES_DB: medico360
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://medico360:medico360@localhost:5432/medico360
      JWT_SECRET_KEY: ci-e2e-secret-nao-usar-em-producao
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python scripts/seed_calculators.py
      - run: python scripts/seed_risco_cv_sbc2025.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: calculadoras-app/package-lock.json
      - run: npm ci
        working-directory: calculadoras-app
      - run: npx playwright install --with-deps chromium
        working-directory: calculadoras-app
      - name: start backend
        run: nohup uvicorn app.main:app --port 8000 &
      - name: start calculadoras-app
        working-directory: calculadoras-app
        run: nohup npm run dev -- --port 5174 &
      - run: npm run test:e2e
        working-directory: calculadoras-app
        env:
          E2E_BASE_URL: http://localhost:5174
