[alembic]
script_location = alembic

# Sem isto, o comando `alembic` (script de console) nao tem o diretorio do
# projeto no sys.path, e `alembic/env.py` falha com "No module named 'app'".
# Nao acontece com `python -m alembic`, que injeta o cwd — foi essa diferenca
# que fez o passo passar localmente e quebrar no CI.
prepend_sys_path = .
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
